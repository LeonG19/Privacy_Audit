# INITIAL domain taxonomy - a starting point, NOT a final ontology.
# The model may return a label outside this list; such labels are kept verbatim, flagged
# `in_taxonomy: false`, and surfaced by `python -m ci_audit domains` so the taxonomy can be
# expanded after reviewing real examples. Do not edit this file to "fit" results silently:
# bump `version` and note the reason in `changelog`.
version: 1
changelog:
  - "v1: seeded from the task examples plus domain labels natively present in MPCI-Bench / AirGapAgent-R / PiSAs. Revise after reviewing real extractions."
reserved:
  Unclear: "Use when the scenario is too ambiguous to assign a social domain without guessing."
  Other: "A real domain not covered below; put the proposed name in `subdomain`."
domains:
  Education: "Schools, universities, students, teachers, admissions, grading."
  Healthcare: "Clinical care, hospitals, insurers acting in care delivery, patient-provider relationships."
  Workplace: "Employer-employee relations, HR, colleagues, hiring, performance."
  Retail: "Shops, e-commerce, customer-merchant relations, marketing to customers."
  Finance: "Banks, lending, payments, financial advisors, credit."
  Insurance: "Insurers and policyholders (underwriting, claims)."
  Personal relationships: "Family, friends, romantic partners, neighbours - informal relationships."
  Government: "Public agencies, law enforcement, courts, regulation, civic services."
  Social media: "Online platforms, posts, followers, public/semipublic sharing."
  Research & publishing: "Academic research, manuscripts, peer review."
  Technology services: "Software/IT operations, cloud services, personal digital assistants and apps."
