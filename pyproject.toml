[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-privacy-audit"
version = "0.1.0"
description = "Foundation for auditing Contextual Integrity privacy benchmarks: download, standardize, extract CI parameters, classify domains."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6",
  "jinja2>=3.1",
  "openai>=1.52",
  "anthropic>=0.37",
  "huggingface_hub>=0.24",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ci-audit = "ci_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["real_data: needs the downloaded benchmark files under data/raw (skipped if absent)"]
